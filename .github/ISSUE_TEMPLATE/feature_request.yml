name: Feature request
description: Suggest an idea or an improvement.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Kaze no Michi is a static, client-side game in which everything is generated in code.

        Proposals that need a backend, accounts, analytics or binary art, audio or model assets are unlikely to fit.

        See the [contributing guide](https://github.com/cryptosecco/kaze-no-michi/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, awkward or broken for you? Describe the situation rather than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Sketches, references and examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem that you thought about, and why you prefer your proposal.
